<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sami & Nehir Rüya</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f0f; color: #f1f1f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        /* Şifre Ekranı */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0f0f; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.8s ease;
        }
        .lock-box {
            background: #1a1a1a; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 350px;
            border: 1px solid #333;
        }
        .lock-box h2 { margin-bottom: 20px; color: #fff; font-size: 22px; }
        .lock-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; text-align: center;
        }
        .lock-box button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #e50914; color: white; font-size: 16px; cursor: pointer; font-weight: bold;
            transition: background 0.3s;
        }
        .lock-box button:hover { background: #b20710; }
        #error-msg { color: #ff4d4d; margin-top: 10px; font-size: 14px; display: none; }

        /* Ana Site İçeriği */
        #main-content {
            display: none; width: 100%; max-width: 800px; padding: 20px;
            text-align: center; animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 { font-size: 32px; margin-bottom: 10px; color: #fff; letter-spacing: 1.5px; }
        .sub-title { color: #e50914; font-size: 18px; margin-bottom: 30px; font-weight: 600; }
        
        .photo-container {
            display: flex; flex-direction: column; gap: 25px; align-items: center; margin-bottom: 30px;
        }
        .photo-card {
            background: #1a1a1a; padding: 15px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.15); border: 1px solid #333;
            max-width: 450px; width: 100%; transition: transform 0.3s;
        }
        .photo-card:hover { transform: translateY(-5px); }
        .photo-card img {
            width: 100%; height: auto; border-radius: 8px; display: block;
        }
        .note {
            font-size: 17px; color: #ccc; line-height: 1.6; background: #161616;
            padding: 25px; border-radius: 12px; border-left: 4px solid #e50914;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- ŞİFRE EKRANI -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>Sami & Nehir Rüya 🔒</h2>
            <p style="color: #888; font-size: 13px; margin-bottom: 15px;">Devam etmek için şifreyi girin:</p>
            <input type="password" id="password-input" placeholder="Şifre">
            <button onclick="checkPassword()">Giriş Yap</button>
            <div id="error-msg">Yanlış şifre, tekrar dene!</div>
        </div>
    </div>

    <!-- ANA SİTE -->
    <div id="main-content">
        <h1>Sami & Nehir Rüya</h1>
        <div class="sub-title">✨ Sonsuza Kadar Birlikte ✨</div>
        
        <div class="photo-container">
            <div class="photo-card">
                <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=" alt="Özel An 1"> 
            </div>
            <div class="photo-card">
                <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=" alt="Özel An 2">
            </div>
        </div>

        <div class="note">
            "Gözlerinin baktığı her yer huzur, adının geçtiği her an ömrümün en güzel hikayesi. İyi ki varsın Nehir Rüya..."
        </div>
    </div>

    <script>
        const DOGRU_SIFRE = "1518"; 

        function checkPassword() {
            const girilenSifre = document.getElementById("password-input").value;
            const lockScreen = document.getElementById("lock-screen");
            const mainContent = document.getElementById("main-content");
            const errorMsg = document.getElementById("error-msg");

            if (girilenSifre === DOGRU_SIFRE) {
                lockScreen.style.opacity = '0';
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                }, 400);
            } else {
                errorMsg.style.display = 'block';
                document.getElementById("password-input").value = "";
            }
        }
        
        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPerson = checkPassword();
            }
        });
    </script>
</body>
</html>
